[platformio]
default_envs = d1_mini
src_dir = src
test_dir = test
lib_dir = lib

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -Wall
    -Wextra
build_src_filter = +<*> -<.git/> -<.pio/> -<.vscode/> -<test/> -<wifi_credentials.local.h>

[env:native]
platform = native
test_framework = unity
build_src_filter = +<*> -<.git/> -<.pio/> -<.vscode/> -<main.cpp> -<display_ssd1306.cpp> -<motor_controller.cpp> -<loconet_interface.cpp> -<eeprom_store.cpp> -<wifi_config.cpp> -<web_server.cpp> -<config.h> -<wifi_credentials.local.h>
